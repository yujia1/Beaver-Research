services:
  postgres:
    image: postgres:15-alpine
    container_name: beaver_postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=beaver_research
      - POSTGRES_USER=beaver_user
      - POSTGRES_PASSWORD=beaver_password_change_in_production
    restart: unless-stopped
    networks:
      - beaver_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U beaver_user -d beaver_research" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: beaver_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://beaver_user:beaver_password_change_in_production@postgres:5432/beaver_research
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=reports
      - MINIO_USE_SSL=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    env_file:
      - .env # Load environment variables from .env file
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - beaver_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build: ./frontend
    container_name: beaver_frontend
    ports:
      - "5173:80" # Changed from 80 to 5173 to match dev server port
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - beaver_network

  minio:
    image: minio/minio:latest
    container_name: beaver_minio
    ports:
      - "9000:9000" # MinIO API
      - "9001:9001" # MinIO Console
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - beaver_network

  redis:
    image: redis:7-alpine
    container_name: beaver_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - beaver_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local

networks:
  beaver_network:
    driver: bridge
