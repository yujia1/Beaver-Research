services:
  backend:
    build: ./backend
    container_name: beaver_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_db:/app/data  # Persist SQLite database
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:////app/data/financial_agent.db
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=reports
      - MINIO_USE_SSL=false
    env_file:
      - .env  # Load environment variables from .env file
    depends_on:
      - minio
    restart: unless-stopped
    networks:
      - beaver_network

  frontend:
    build: ./frontend
    container_name: beaver_frontend
    ports:
      - "5173:80"  # Changed from 80 to 5173 to match dev server port
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - beaver_network

  minio:
    image: minio/minio:latest
    container_name: beaver_minio
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - beaver_network

volumes:
  backend_db:
    driver: local
  minio_data:
    driver: local

networks:
  beaver_network:
    driver: bridge
