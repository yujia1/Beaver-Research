apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: beaver-research
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  MINIO_BUCKET: "reports"
  MINIO_USE_SSL: "false"
  AWS_REGION: "us-east-1"
  RATE_LIMIT_PER_MINUTE: "60"
