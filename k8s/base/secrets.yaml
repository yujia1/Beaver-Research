apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: beaver-research
type: Opaque
stringData:
  # NOTE: These are placeholders. In production, use:
  # 1. kubectl create secret or
  # 2. External Secrets Operator with AWS Secrets Manager/Vault
  # 3. Sealed Secrets for GitOps
  DATABASE_URL: "postgresql://beaver_user:CHANGE_ME@postgres:5432/beaver_research"
  SECRET_KEY: "CHANGE_THIS_IN_PRODUCTION_USE_SECRETS_MANAGER"
  OPENAI_API_KEY: "CHANGE_ME"
  FRED_API_KEY: "CHANGE_ME"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: beaver-research
type: Opaque
stringData:
  POSTGRES_DB: "beaver_research"
  POSTGRES_USER: "beaver_user"
  POSTGRES_PASSWORD: "CHANGE_THIS_IN_PRODUCTION"
